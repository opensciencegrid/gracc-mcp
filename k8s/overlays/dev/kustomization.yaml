apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gracc-mcp

resources:
  - ../../base
  - namespace.yaml

images:
  - name: ghcr.io/example/gracc-mcp-server
    newName: ghcr.io/opensciencegrid/gracc-mcp-server
    # Pin a sha-<commit> tag for anything long-lived; the base uses
    # imagePullPolicy: IfNotPresent, so "latest" will not refresh on its own.
    newTag: latest
