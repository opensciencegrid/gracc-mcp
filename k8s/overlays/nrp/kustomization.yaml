apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NRP / Nautilus deployment, fronted by the Envoy AI Gateway MCP listener at
# https://mcp.nrp-nautilus.io/unl-weitzel/gracc
#
# The namespace already exists and is not created here.
namespace: unl-weitzel

resources:
  - ../../base
  - referencegrant.yaml

images:
  - name: ghcr.io/example/gracc-mcp-server
    # Published by .github/workflows/docker.yml. Pinned to a commit tag because
    # the base uses imagePullPolicy: IfNotPresent.
    newName: ghcr.io/opensciencegrid/gracc-mcp-server
    newTag: sha-449ae15

# The HTTP transport is stateless (sessionIdGenerator: undefined in
# src/http/app.ts), so replicas scale freely. The gateway owns MCP sessions.
replicas:
  - name: gracc-mcp
    count: 2
